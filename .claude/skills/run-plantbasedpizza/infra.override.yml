# postgres:latest is v18, which refuses to start with the repo's /var/lib/postgresql/data
# volume layout -> Temporal never comes up -> orders-worker crashes. Pin to 17.
services:
  postgresql:
    image: postgres:17

  # A native Windows mongod on this machine also binds 127.0.0.1:27017 and wins for
  # localhost clients. Expose the stack's Mongo on 27018 too, for Compass/Rider/mongosh.
  # (Services inside the stack keep using mongodb:27017.)
  mongodb:
    ports:
      - 27018:27017
